org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9: built-in Kotlin (replaces org.jetbrains.kotlin.android)
android.builtInKotlin=true

# Allow Gradle to auto-provision JDK toolchains (compile/test on JVM 17)
org.gradle.java.installations.auto-download=true

# Fix for "Could not connect to Kotlin compile daemon"
kotlin.daemon.jvm.options=-Xmx2048m
